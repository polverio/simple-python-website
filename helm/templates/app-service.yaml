apiVersion: v1
kind: Service
metadata:
  name: {{ include "simple-python-website.fullname" . }}
  labels:
    {{- include "simple-python-website.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "simple-python-website.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app

